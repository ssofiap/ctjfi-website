name: CI

on:
  pull_request:
  push:
    branches:
    - main
    - 'feature/**'
    - 'hotfix/**'

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
  
  detect-calendar:
    name: Detect calendar integration
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check calendar endpoints
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/src/app/api/calendar/route.ts ]] &&
            [[ -f frontend/src/app/calendar/page.tsx ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Calendar endpoints are present; integration test will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Calendar endpoints are absent; integration test will be skipped."
          fi

  calendar-integration:
    name: Calendar API integration
    needs: detect-calendar
    if: needs.detect-calendar.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start frontend
        run: |
          npm run start > /tmp/ctjfi-frontend.log 2>&1 &
          echo $! > /tmp/ctjfi-frontend.pid

      - name: Wait for frontend
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/calendar > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ctjfi-frontend.log
          exit 1

      - name: Test calendar API and frontend
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/calendar > /tmp/calendar-response.json
          node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('/tmp/calendar-response.json', 'utf8')); if (!Array.isArray(data.events)) { throw new Error('Calendar API response must contain an events array'); }"
          curl --fail --silent --show-error http://127.0.0.1:3000/calendar | grep -q 'Calendar'

      - name: Stop frontend
        if: always()
        run: |
          if [ -f /tmp/ctjfi-frontend.pid ]; then
            kill "$(cat /tmp/ctjfi-frontend.pid)" || true
          fi

  config-security:
    name: Config and workflow security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint GitHub workflows
        uses: reviewdog/action-actionlint@v1.45.0

      - name: Scan repository config with Trivy
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1